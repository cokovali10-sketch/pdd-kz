[package]
name = "pdd-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Content validator, ticket builder and statistics for the JolBilet PDD trainer"

[[bin]]
name = "pdd-cli"
path = "src/main.rs"

[dependencies]
pdd-core = { path = "../pdd-core" }
pdd-srs = { path = "../pdd-srs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"